name: Release · Linux
on:
  workflow_dispatch:
    inputs:
      version: { description: Test SemVer without v, required: true, default: 4.0.0-test.1, type: string }
      issue_number: { description: Existing Linux release Issue number (optional), required: false, type: string }
permissions:
  actions: read
  contents: write
  issues: write
jobs:
  release:
    uses: ./.github/workflows/_native-package.yml
    with: { platform: linux, revision: "${{ github.sha }}", version: "${{ inputs.version }}", issue_number: "${{ inputs.issue_number }}", publish_prerelease: true }
    secrets: inherit
