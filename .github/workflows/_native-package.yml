name: Native package (reusable)

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      version:
        required: false
        type: string
        default: 4.1.0-test.3
      revision:
        required: true
        type: string
      formal_release:
        required: false
        type: boolean
        default: false
      release_candidate:
        required: false
        type: boolean
        default: false
    secrets:
      WINDOWS_CSC_LINK: { required: false }
      WINDOWS_CSC_KEY_PASSWORD: { required: false }
      MACOS_CSC_LINK: { required: false }
      MACOS_CSC_KEY_PASSWORD: { required: false }
      APPLE_ID: { required: false }
      APPLE_APP_SPECIFIC_PASSWORD: { required: false }
      APPLE_TEAM_ID: { required: false }

jobs:
  package:
    name: ${{ inputs.platform }} native package
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2025' || inputs.platform == 'macos' && 'macos-14' || 'ubuntu-24.04' }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
      - name: Verify the requested release revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.revision }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            DomainIntelWeb/package-lock.json
            DomainIntelDesktop/package-lock.json
      - name: Require formal-release credentials
        if: inputs.formal_release && inputs.platform == 'windows'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
      - name: Require signing and notarization credentials
        if: inputs.formal_release && inputs.platform == 'macos'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
      - name: Install Python product and test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -e './DomainIntelSearch[dev]' pyinstaller==6.22.2
      - name: Install JavaScript dependencies
        shell: bash
        run: npm ci --prefix DomainIntelWeb && npm ci --prefix DomainIntelDesktop
      - name: Verify generated OpenAPI contract has no drift
        shell: bash
        run: |
          python DomainIntelWeb/scripts/export_openapi.py
          python DomainIntelWeb/scripts/generate_contract.py
          git diff --exit-code -- DomainIntelWeb/openapi.json DomainIntelWeb/src/generated/openapi.ts
      - name: Run complete Python product suite
        shell: bash
        run: |
          mkdir -p test-results
          python -m pytest -q DomainIntelSearch/tests DomainIntelApp/tests DomainIntelWeb/tests --junitxml=test-results/python.xml
      - name: Check Python repository structure
        shell: bash
        run: python DomainIntelSearch/scripts/check_repo.py
      - name: Test and build Web workbench
        shell: bash
        run: |
          set -o pipefail
          npm test --prefix DomainIntelWeb 2>&1 | tee test-results/web.log
          npm run build --prefix DomainIntelWeb
      - name: Test desktop shell
        shell: bash
        run: |
          set -o pipefail
          npm test --prefix DomainIntelDesktop 2>&1 | tee test-results/desktop.log
      - name: Stage platform-neutral resources
        shell: bash
        run: python DomainIntelDesktop/scripts/prepare_resources.py
      - name: Build native sidecar
        shell: bash
        run: python DomainIntelApp/packaging/build_sidecar.py
      - name: Smoke-test native sidecar (CLI, API, Worker --once)
        shell: bash
        run: python DomainIntelDesktop/scripts/smoke_sidecar.py --executable DomainIntelDesktop/build/backend/intdog-runtime${{ inputs.platform == 'windows' && '.exe' || '' }}
      - name: Build unsigned Windows test installer
        if: inputs.platform == 'windows' && !inputs.formal_release
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:windows --prefix DomainIntelDesktop
      - name: Build signed Windows installer
        if: inputs.platform == 'windows' && inputs.formal_release
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist:windows --prefix DomainIntelDesktop
      - name: Install, launch, close, and reopen Windows installer
        if: inputs.platform == 'windows'
        shell: bash
        run: |
          lifecycle=(--allow-native-service-mutation)
          if [ "${{ inputs.formal_release || inputs.release_candidate }}" != "true" ]; then lifecycle=(--allow-external-gaps); fi
          python DomainIntelDesktop/scripts/smoke_desktop.py --artifact DomainIntelDesktop/dist/IntDog-${{ inputs.version }}-windows-x64.exe --kind windows-nsis --sidecar DomainIntelDesktop/build/backend/intdog-runtime.exe "${lifecycle[@]}"
      - name: Build unsigned macOS test installer
        if: inputs.platform == 'macos' && !inputs.formal_release
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:macos --prefix DomainIntelDesktop
      - name: Build signed and notarized macOS installer
        if: inputs.platform == 'macos' && inputs.formal_release
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:macos --prefix DomainIntelDesktop
      - name: Mount, launch, close, and reopen macOS installer
        if: inputs.platform == 'macos'
        shell: bash
        run: |
          lifecycle=(--allow-native-service-mutation)
          if [ "${{ inputs.formal_release || inputs.release_candidate }}" != "true" ]; then lifecycle=(--allow-external-gaps); fi
          python DomainIntelDesktop/scripts/smoke_desktop.py --artifact DomainIntelDesktop/dist/IntDog-${{ inputs.version }}-macos-arm64.dmg --kind macos-dmg --sidecar DomainIntelDesktop/build/backend/intdog-runtime "${lifecycle[@]}"
      - name: Build Linux installer
        if: inputs.platform == 'linux'
        shell: bash
        run: npm run dist:linux --prefix DomainIntelDesktop
      - name: Launch, close, and reopen Linux AppImage
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          lifecycle=(--allow-native-service-mutation)
          if [ "${{ inputs.formal_release || inputs.release_candidate }}" != "true" ]; then lifecycle=(--allow-external-gaps); fi
          xvfb-run -a python DomainIntelDesktop/scripts/smoke_desktop.py --artifact DomainIntelDesktop/dist/IntDog-${{ inputs.version }}-linux-x86_64.AppImage --kind appimage --sidecar DomainIntelDesktop/build/backend/intdog-runtime "${lifecycle[@]}"
      - name: Write platform artifact SHA256 and same-SHA evidence
        shell: bash
        run: python DomainIntelDesktop/scripts/release_evidence.py --dist DomainIntelDesktop/dist --platform "${{ inputs.platform }}" --revision "${{ inputs.revision }}" --output "test-results/${{ inputs.platform }}-artifact-evidence.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intdog-${{ inputs.platform }}-${{ inputs.version }}
          path: |
            DomainIntelDesktop/dist/*.exe
            DomainIntelDesktop/dist/*.dmg
            DomainIntelDesktop/dist/*.AppImage
            DomainIntelDesktop/dist/*.native-smoke.json
            test-results/${{ inputs.platform }}-artifact-evidence.json
            test-results/${{ inputs.platform }}-artifact-evidence.sha256
            test-results/*
          if-no-files-found: error
