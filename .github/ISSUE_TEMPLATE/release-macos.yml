name: macOS platform release
description: Track one unsigned macOS x64 test release.
title: "prerelease(macos): IntDog "
labels: [release, macos]
body:
  - type: input
    id: version
    attributes: { label: Version, placeholder: 4.0.0 }
    validations: { required: true }
  - type: checkboxes
    id: gates
    attributes:
      label: Native gates
      options:
        - { label: Native x64 sidecar smoke passed on macOS, required: true }
        - { label: Unsigned DMG mount-launch-close-reopen passed, required: true }
        - { label: Release is marked Pre-release and warns about Gatekeeper, required: true }
        - { label: Shared three-platform architecture gate is green, required: true }
