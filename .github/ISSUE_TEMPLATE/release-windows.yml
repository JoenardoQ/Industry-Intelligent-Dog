name: Windows platform release
description: Track one unsigned Windows x64 test release.
title: "prerelease(windows): IntDog "
labels: [release, windows]
body:
  - type: input
    id: version
    attributes: { label: Version, placeholder: 4.0.0 }
    validations: { required: true }
  - type: checkboxes
    id: gates
    attributes:
      label: Native gates
      options:
        - { label: Windows native sidecar smoke passed, required: true }
        - { label: Unsigned NSIS install-launch-close-reopen passed, required: true }
        - { label: Release is marked Pre-release and warns about SmartScreen, required: true }
        - { label: Shared three-platform architecture gate is green, required: true }
