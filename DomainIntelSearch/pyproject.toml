[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intdog-domain-intelligence"
version = "4.1.0.dev4"
description = "Evidence-aware, local-first industry intelligence workflows"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "feedparser>=6.0.11,<7",
  "PyYAML>=6.0.1,<7",
  "python-dateutil>=2.8.2,<3",
  "tzdata>=2025.2,<2028",
  "pypdf>=5,<7",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
finance = ["akshare>=1.13", "pandas>=2.1"]
html = ["beautifulsoup4>=4.12", "lxml>=5.1"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["src*", "intdog_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
